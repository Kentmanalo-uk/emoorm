  <!--
    Shopping-bag "e" logo, vectorised on the original 2048 x 2048 pixel grid.

    Straight geometry (least-squares fits to the original, max deviation about 1px):
      Bag left edge    x = 529.42 - 0.16113*y
      Bag right edge   x = 1550.04 + 0.13783*y
      Side-panel top   y = 592
      Front top        (716.2, 601) to (1500, 602.4) to (1634.1, 610)
      Side/front seam  x = 703.5 - 0.11696*(y - 700)
    Curves (bag bottom, handle, collars, stripes, the "e") are cubic Beziers
    fitted to the original outline within about 1px.
  -->
