earGradient><linearGradient id="d-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BAE6FD"/></linearGradient><linearGradient id="d-umbrella" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#BE185D"/></linearGradient><radialGradient id="d-sun" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FEF9C3"/><stop offset="0.5" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></radialGradient><radialGradient id="d-ball" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FCA5A5"/><stop offset="1" stop-color="#B91C1C"/></radialGradient>
