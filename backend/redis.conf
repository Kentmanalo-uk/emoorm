# Redis configuration for E-MOORM's cache.
#
# This instance holds nothing but cache entries — every value can be rebuilt
# from MySQL — so it is configured as a pure cache rather than a datastore:
# bounded memory, LRU eviction, and no persistence.
#
# Start it with:  npm run redis        (from backend/)
# Check it with:  npm run redis:cli

port 6379

# Only accept connections from this machine. Expose it deliberately (and with
# a password) if the API ever runs on a different host.
bind 127.0.0.1

# ── Memory ───────────────────────────────────────────────────────────
# A hard ceiling, so a growing cache can never starve MySQL or the API of
# RAM. Raise this in production to suit the box; 256MB holds a very large
# number of category/product/store payloads.
maxmemory 256mb

# When full, drop the least recently used keys. The default (noeviction)
# would instead start failing writes — the cache would silently stop working
# while Redis stayed "up". allkeys-lru is the correct policy for a cache.
maxmemory-policy allkeys-lru

# ── Persistence ──────────────────────────────────────────────────────
# Disabled on purpose. Nothing here is a source of truth, so writing RDB
# snapshots would only cost disk I/O and fork pauses. A restart simply
# starts with a cold cache, which refills from the database.
save ""
appendonly no

# ── Safety ───────────────────────────────────────────────────────────
# Stop a background-save failure (there are no saves) from blocking writes.
stop-writes-on-bgsave-error no

# Keep the log quiet in day-to-day development.
loglevel notice
